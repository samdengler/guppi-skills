[project]
name = "guppi-committer"
version = "0.1.0"
description = "Standardize git commit messages with format and prose checks"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=14.0.0",
]

[project.scripts]
guppi-committer = "guppi_committer.cli:app"

[tool.guppi]
name = "committer"
description = "Standardize git commit messages with format and prose checks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guppi_committer"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "guppi_committer/SKILL.md"
