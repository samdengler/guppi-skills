[project]
name = "guppi-tracker"
version = "0.2.2"
description = "Cross-project task and idea tracker built on beads"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=14.0.0",
    "guppi-beads>=0.1.0",
]

[tool.uv.sources]
guppi-beads = { path = "../lib/beads" }

[project.scripts]
guppi-tracker = "guppi_tracker.cli:app"

[tool.guppi]
name = "tracker"
description = "Cross-project task and idea tracker built on beads"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guppi_tracker"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "guppi_tracker/SKILL.md"
