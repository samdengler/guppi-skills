[project]
name = "guppi-surfer"
version = "0.1.0"
description = "Chrome browser automation via AppleScript JavaScript execution"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
]

[project.scripts]
guppi-surfer = "guppi_surfer.cli:app"

[tool.guppi]
name = "surfer"
description = "Chrome browser automation via AppleScript JavaScript execution"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guppi_surfer"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "guppi_surfer/SKILL.md"
