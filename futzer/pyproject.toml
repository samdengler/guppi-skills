[project]
name = "guppi-futzer"
version = "0.1.0"
description = "Opinionated config generator you own and understand"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=14.0.0",
]

[project.scripts]
guppi-futzer = "guppi_futzer.cli:app"

[tool.guppi]
name = "futzer"
description = "Opinionated config generator you own and understand"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guppi_futzer"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "guppi_futzer/SKILL.md"
