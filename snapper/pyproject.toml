[project]
name = "guppi-snapper"
version = "0.1.2"
description = "CDP browser screenshots for capturing authenticated web pages"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=14.0.0",
    "playwright>=1.40.0",
    "pyyaml>=6.0",
]

[project.scripts]
guppi-snapper = "guppi_snapper.cli:app"

[tool.guppi]
name = "snapper"
description = "CDP browser screenshots for capturing authenticated web pages"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guppi_snapper"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "guppi_snapper/SKILL.md"
