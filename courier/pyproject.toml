[project]
name = "guppi-courier"
version = "0.1.2"
description = "Telegram-based messaging for Claude workflows"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
]

[project.scripts]
guppi-courier = "guppi_courier.cli:app"

[tool.guppi]
name = "courier"
description = "Telegram-based messaging for Claude workflows"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guppi_courier"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "guppi_courier/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
