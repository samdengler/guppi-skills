[project]
name = "guppi-usher"
version = "0.1.0"
description = "Rank movie showtimes by format and find the best contiguous seats by your saved preferences"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project.scripts]
guppi-usher = "guppi_usher.cli:app"

[tool.guppi]
name = "usher"
description = "Rank movie showtimes by format and find the best contiguous seats by your saved preferences"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guppi_usher"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "guppi_usher/SKILL.md"
