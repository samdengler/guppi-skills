[project]
name = "guppi-dotfiles"
version = "0.1.0"
description = "Add, remove, and reconcile machine dependencies through the dotfiles manifests (Brewfile and mise config)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=14.0.0",
]

[project.scripts]
guppi-dotfiles = "guppi_dotfiles.cli:app"

[tool.guppi]
name = "dotfiles"
description = "Add, remove, and reconcile machine dependencies through the dotfiles manifests (Brewfile and mise config)"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guppi_dotfiles"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "guppi_dotfiles/SKILL.md"
