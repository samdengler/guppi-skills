[project]
name = "guppi-chronicler"
version = "0.1.2"
description = "Research historical events from local history sources"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
chrome = []
terminal = []

[project.scripts]
guppi-chronicler = "guppi_chronicler.cli:app"

[tool.guppi]
name = "chronicler"
description = "Research historical events from local history sources"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guppi_chronicler"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "guppi_chronicler/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
