[project]
name = "guppi-clipper"
version = "0.1.0"
description = "Copy content to the system clipboard without whitespace noise"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=14.0.0",
]

[project.scripts]
guppi-clipper = "guppi_clipper.cli:app"

[tool.guppi]
name = "clipper"
description = "Copy content to the system clipboard without whitespace noise"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guppi_clipper"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "guppi_clipper/SKILL.md"
