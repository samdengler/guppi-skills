[project]
name = "guppi-locker"
version = "0.1.0"
description = "Deterministic secret storage for guppi skills"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=14.0.0",
    "cryptography>=44.0.0",
]

[project.scripts]
guppi-locker = "guppi_locker.cli:app"

[tool.guppi]
name = "locker"
description = "Deterministic secret storage for guppi skills"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guppi_locker"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "guppi_locker/SKILL.md"
